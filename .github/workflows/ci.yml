name: CI

on:
  # PR branches only; main has nothing new after merge.
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # matches mise.toml
          cache: npm
      - run: npm ci
      - run: node --test
      # Generative music: no wrong notes, clashes or awkward leaps in any mood.
      - run: node tools/music-audit.js
      # Bundles the Worker without deploying: catches import/config mistakes.
      - run: npx wrangler deploy --dry-run --outdir dist

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [test, zizmor]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

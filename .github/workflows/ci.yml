name: CI

on:
  # PR branches only; main has nothing new after merge.
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26" # matches mise.toml
          cache: npm
      - run: npm ci
      - run: node --test
      # A minute of real play in the runner's Chrome: load, click, buy, every tab, reload.
      - run: npm run test:browser
      # axe-core (WCAG 2.2 AA + best practice) over every tab, settings section and the inbox, plus keyboard tab navigation.
      - run: npm run test:a11y
      # Generative music: no wrong notes, clashes or awkward leaps in any mood.
      - run: node tools/music-audit.js
      # Bundles the Worker without deploying: catches import/config mistakes.
      - run: npx wrangler deploy --dry-run --outdir dist

  # The same browser tests on WebKit, Safari's engine: iPhone issues (layout, CSS, form behaviour) show up here
  # before a phone does. Playwright's WebKit is close to Safari, not identical (no iOS touch handling).
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26" # matches mise.toml
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      - run: npm run test:browser
        env:
          ENGINE: webkit
      - run: npm run test:a11y
        env:
          ENGINE: webkit

  zizmor:
    uses: drumandbytes/reusable-actions/.github/workflows/zizmor.yml@v1

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [test, zizmor, webkit]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

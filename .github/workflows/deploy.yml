name: Deploy

# Not the reusable worker deploy: D1 migrations have to run before the new code.
# Runs on release tags, which release-please (as dnb-robot) creates when its release PR is
# merged, so what's live is always a release and its version matches the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Queue rather than cancel, so an older deploy can't finish last and win.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # matches mise.toml
          # No dependency cache in a deploy job: a poisoned cache would ship.
          package-manager-cache: false
      - run: npm ci
      - run: node --test
      # The game's "What's new" card reads the changelog from its own domain.
      - run: cp CHANGELOG.md public/CHANGELOG.md
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply rows-to-riches --remote
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
